<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerd Cronico</title>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.min.css">
</head>
<body>
    <section class="s-main">
        <div class="background">
            <main>
                <img src="./img/logo.png" alt="" class="logo">
                <div class="plane">
                    <div class="vlines">
                        <div class="lines">
                            <div class="left">
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                            </div>
                            <div class="right">
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                            </div>
                        </div>
                        <div class="lines">
                            <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div class="left-content" data-aos="zoom-out-up" data-aos-delay="3000" data-aos-duration="1000">
            <h2>Meu video mais recente: </h2>
            <iframe src="https://www.youtube.com/embed?listType=playlist&list=UUZSQe30xJdDSjsHmZt3ZNNA">
            </iframe>
        </div>
        <div class="right-content">
            <img src="./img/tulkas.png" data-aos="fade-left" data-aos-delay="2000" data-aos-duration="1000">
        </div>
    </section>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
